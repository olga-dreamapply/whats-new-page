<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's new in DreamApply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

  <!-- Fixed-Height Light Header (80px) -->
  <header>
    <div class="header-content">
      <h1>What's new in DreamApply</h1>
    </div>
  </header>

  <!-- Page Content Container -->
  <div class="page-body">
    <p class="subtitle">A complete log of product improvements, features, and bug fixes.</p>

    <!-- Minimal Product Momentum Report -->
    <section class="stats-container">
      <div class="stats-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Product Momentum Report
      </div>
      <div class="stats-subtitle" id="stats-month-label">Here is a breakdown of what was shipped this month:</div>

      <ul class="stats-list">
        <li>Features: <strong id="stat-features">0</strong></li>
        <li>Enhancements: <strong id="stat-enhancements">0</strong></li>
        <li>UI/UX Tweaks: <strong id="stat-ux">0</strong></li>
        <li>Bugs Fixed: <strong id="stat-bugs">0</strong></li>
      </ul>
    </section>

    <!-- Year Switcher Bar -->
    <div class="controls-bar" id="year-switcher"></div>

    <!-- Layout Grid -->
    <div class="main-container">
      
      <!-- Timeline Feed -->
      <main class="changelog-feed" id="changelog-feed">
        <div class="no-updates">Loading changelog...</div>
      </main>

      <!-- Category Filters Sidebar -->
      <aside class="sidebar">
        <div class="filter-title">Categories</div>
        <div class="checkbox-group" id="category-filters">
          <label class="checkbox-label">
            <input type="checkbox" value="Feature" checked> Feature
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="Enhancement" checked> Enhancement
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="Bug fix" checked> Bug fix
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="UX/UI" checked> UX/UI
          </label>
        </div>
      </aside>

    </div>
  </div>

  <script src="scripts/scripts.js"></script>
</body>
</html>
